[bundles]
# Applied to every Compose module, chai included — keep feature deps per-module.
compose = ["compose-material3", "compose-materialIcons", "compose-ui", "compose-ui-util", "compose-ui-tooling", "compose-ui-tooling-preview", "compose-preview-customview", "compose-preview-customview-poolingcontainer"]
