navigation3 = ["androidx-navigation3-runtime", "androidx-navigation3-ui", "androidx-lifecycle-viewmodel-navigation3"]
serialization = ["kotlinx-serialization-core", "kotlinx-serialization-json"]
lifecycle = ["lifecycle-livedataKtx", "lifecycle-runtimeKtx"]
room = ["room-ktx", "room-runtime"]
ktor = ["ktor-core", "ktor-android", "ktor-json", "ktor-content-negotiation", "ktor-auth", "ktor-logging", "ktor-okhttp"]
firebase = ["firebase-messaging", "firebase-crashlytics", "firebase-analytics", "firebase-performance", "firebase-remote-config", "firebase-common"]
test = ["junit4", "test-junit-ktx"]

[plugins]
