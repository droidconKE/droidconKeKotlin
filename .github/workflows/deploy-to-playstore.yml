name: Deploy to Playstore

on:
  push:
    branches: [ 'releases/**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Write the signing key
        env:
          PLAYSTORE_SIGNING_KEY: ${{ secrets.PLAYSTORE_SIGNING_KEY }}
        run: echo "$PLAYSTORE_SIGNING_KEY" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.jks"

      - name: Build and sign the release bundle
        env:
          ORG_GRADLE_PROJECT_versionCode: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_versionName: 1.0.${{ github.run_number }}
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PuploadCrashlyticsMapping=true

      - name: Keep the R8 mapping with the run
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Deploy to Production
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICES_JSON }}
          packageName: ke.droidcon.kotlin
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          tracks: production
          whatsNewDirectory: whatsnew/
          status: completed
