name: CI

# No `paths:` filter — a PR touching only Kotlin source must not skip CI.
# The push-to-main trigger is what seeds the Gradle cache: gradle/actions/setup-gradle
# only writes it on the default branch, so without this every PR job runs cold.
on:
  pull_request:
  merge_group:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Quoted so the whole string reaches the daemon: gradle.properties sets file.encoding
  # alongside the heap, and org.gradle.jvmargs replaces wholesale rather than appending.
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: spotless, ktlint, detekt
        run: ./gradlew spotlessCheck ktlintCheck detekt --continue

      - name: Android Lint
        run: ./gradlew lint

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests and build the coverage report
        run: ./gradlew testDebugUnitTest createDebugCombinedCoverageReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      # Skipped rather than silently failed on forks, which cannot read repository secrets.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # assembleRelease is the only task that exercises R8, so a keep-rule or shrinking
      # regression surfaces here rather than in the release lane after merge.
      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease

  instrumentation-tests:
    name: Instrumentation (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Managed devices from build-logic/.../ManagedDevices.kt.
        device: [ api30, api34 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # --stacktrace because managed-device setup failures report an unset property
      # without naming it, which is undiagnosable from the message alone.
      - name: Run instrumentation tests
        run: >
          ./gradlew :data:${{ matrix.device }}DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-results-${{ matrix.device }}
          path: '**/build/reports/androidTests/'
          if-no-files-found: ignore
